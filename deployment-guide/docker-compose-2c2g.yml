# Docker Compose 配置 - 2核2GB 服务器优化版
# 此配置专门针对低配服务器优化，牺牲部分功能换取稳定运行

version: '3.8'

services:
  # ==================== 基础服务 ====================
  
  # MySQL 数据库 - 极限优化
  mysql:
    image: mysql:8.0
    container_name: pig-mysql
    restart: always
    mem_limit: 400m
    mem_reservation: 300m
    cpus: 0.5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: pig
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ./mysql/my-2c2g.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - pig-network
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=30
      --innodb_buffer_pool_size=100M
      --innodb_log_buffer_size=4M
      --query_cache_size=0
      --query_cache_type=0
      --table_open_cache=32
      --performance_schema=OFF

  # Redis 缓存 - 极限优化
  redis:
    image: redis:7-alpine
    container_name: pig-redis
    restart: always
    mem_limit: 100m
    mem_reservation: 80m
    cpus: 0.3
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - pig-network
    command: >
      redis-server
      --maxmemory 80mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no

  # Nacos 注册中心 - 极限优化
  nacos:
    image: pig-register:latest
    container_name: pig-nacos
    restart: always
    mem_limit: 400m
    mem_reservation: 300m
    cpus: 0.5
    environment:
      MODE: standalone
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nacos
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATASOURCE_PLATFORM: mysql
      TZ: Asia/Shanghai
      JVM_XMS: 128m
      JVM_XMX: 256m
      JVM_XMN: 64m
      JAVA_OPTS: >-
        -Xms128m -Xmx256m -Xmn64m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=500
        -XX:+DisableExplicitGC
        -XX:+HeapDumpOnOutOfMemoryError
        -Dnacos.standalone=true
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - pig-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== PIG 微服务 - 极限优化 ====================

  # 网关服务
  gateway:
    image: pig-gateway:latest
    container_name: pig-gateway
    restart: always
    mem_limit: 300m
    mem_reservation: 200m
    cpus: 0.4
    environment:
      NACOS_HOST: nacos
      REDIS_HOST: redis
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Xms128m -Xmx200m -Xmn64m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=500
        -XX:+DisableExplicitGC
        -XX:MetaspaceSize=64m
        -XX:MaxMetaspaceSize=128m
    ports:
      - "9999:9999"
    depends_on:
      - nacos
      - redis
    networks:
      - pig-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 认证服务
  auth:
    image: pig-auth:latest
    container_name: pig-auth
    restart: always
    mem_limit: 300m
    mem_reservation: 200m
    cpus: 0.3
    environment:
      NACOS_HOST: nacos
      REDIS_HOST: redis
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Xms128m -Xmx200m -Xmn64m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=500
        -XX:+DisableExplicitGC
        -XX:MetaspaceSize=64m
        -XX:MaxMetaspaceSize=128m
    depends_on:
      - nacos
      - redis
    networks:
      - pig-network

  # 用户权限服务
  upms:
    image: pig-upms:latest
    container_name: pig-upms
    restart: always
    mem_limit: 300m
    mem_reservation: 200m
    cpus: 0.4
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      TZ: Asia/Shanghai
      JAVA_OPTS: >-
        -Xms128m -Xmx200m -Xmn64m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=500
        -XX:+DisableExplicitGC
        -XX:MetaspaceSize=64m
        -XX:MaxMetaspaceSize=128m
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - pig-network

  # ==================== 可选服务（注释掉以节省资源）====================

  # 代码生成服务 - 默认关闭
  # codegen:
  #   image: pig-codegen:latest
  #   container_name: pig-codegen
  #   restart: always
  #   mem_limit: 300m
  #   cpus: 0.3
  #   environment:
  #     NACOS_HOST: nacos
  #     MYSQL_HOST: mysql
  #     REDIS_HOST: redis
  #     TZ: Asia/Shanghai
  #     JAVA_OPTS: "-Xms128m -Xmx200m -XX:+UseG1GC"
  #   depends_on:
  #     - nacos
  #     - mysql
  #     - redis
  #   networks:
  #     - pig-network

  # 监控服务 - 默认关闭
  # monitor:
  #   image: pig-monitor:latest
  #   container_name: pig-monitor
  #   restart: always
  #   mem_limit: 300m
  #   cpus: 0.3
  #   environment:
  #     NACOS_HOST: nacos
  #     TZ: Asia/Shanghai
  #     JAVA_OPTS: "-Xms128m -Xmx200m -XX:+UseG1GC"
  #   ports:
  #     - "5001:5001"
  #   depends_on:
  #     - nacos
  #   networks:
  #     - pig-network

  # ==================== 前端服务 ====================

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: pig-nginx
    restart: always
    mem_limit: 50m
    mem_reservation: 30m
    cpus: 0.2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./pig-ui/dist:/usr/share/nginx/html/admin:ro
      - ./docs/build:/usr/share/nginx/html/docs:ro
    depends_on:
      - gateway
    networks:
      - pig-network

networks:
  pig-network:
    driver: bridge

# ==================== 资源使用总结 ====================
# MySQL:    400MB (0.5 CPU)
# Redis:    100MB (0.3 CPU)
# Nacos:    400MB (0.5 CPU)
# Gateway:  300MB (0.4 CPU)
# Auth:     300MB (0.3 CPU)
# UPMS:     300MB (0.4 CPU)
# Nginx:     50MB (0.2 CPU)
# ----------------------------------------
# 总计:    ~1.85GB (2.6 CPU)
# 
# 说明：
# - 需要配置 Swap 分区（至少 1GB）
# - 关闭了 codegen 和 monitor 服务
# - 所有 JVM 参数已优化到最小
# - 数据库连接数限制为 30
# - Redis 禁用持久化以节省内存
