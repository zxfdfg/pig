version: '3.8'

services:
  # ==================== 基础服务 ====================
  
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: pig-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: pig
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    networks:
      - pig-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: pig-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - pig-network
    command: redis-server --appendonly yes

  # Nacos 注册中心
  nacos:
    build:
      context: ./pig-services/pig-register
      dockerfile: Dockerfile
    container_name: pig-nacos
    restart: always
    environment:
      MODE: standalone
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nacos
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATASOURCE_PLATFORM: mysql
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    depends_on:
      - mysql
    networks:
      - pig-network

  # ==================== PIG 微服务 ====================

  # 网关服务
  gateway:
    build:
      context: ./pig-services/pig-gateway
      dockerfile: Dockerfile
    container_name: pig-gateway
    restart: always
    environment:
      NACOS_HOST: nacos
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    ports:
      - "9999:9999"
    depends_on:
      - nacos
      - redis
    networks:
      - pig-network

  # 认证服务
  auth:
    build:
      context: ./pig-services/pig-auth
      dockerfile: Dockerfile
    container_name: pig-auth
    restart: always
    environment:
      NACOS_HOST: nacos
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      - nacos
      - redis
    networks:
      - pig-network

  # 用户权限服务
  upms:
    build:
      context: ./pig-services/pig-upms/pig-upms-biz
      dockerfile: Dockerfile
    container_name: pig-upms
    restart: always
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - pig-network

  # 代码生成服务
  codegen:
    build:
      context: ./pig-services/pig-visual/pig-codegen
      dockerfile: Dockerfile
    container_name: pig-codegen
    restart: always
    environment:
      NACOS_HOST: nacos
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      - nacos
      - mysql
      - redis
    networks:
      - pig-network

  # 监控服务
  monitor:
    build:
      context: ./pig-services/pig-visual/pig-monitor
      dockerfile: Dockerfile
    container_name: pig-monitor
    restart: always
    environment:
      NACOS_HOST: nacos
      TZ: Asia/Shanghai
    ports:
      - "5001:5001"
    depends_on:
      - nacos
    networks:
      - pig-network

  # ==================== 前端服务 ====================

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: pig-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./pig-ui/dist:/usr/share/nginx/html/admin:ro
      - ./docs/build:/usr/share/nginx/html/docs:ro
    depends_on:
      - gateway
    networks:
      - pig-network

networks:
  pig-network:
    driver: bridge
